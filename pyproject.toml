[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "relay-assignment"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pypdf>=5,<8", "numpy>=1.24,<3", "reportlab>=4,<6"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["relay*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
